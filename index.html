<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernConnect | Student Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-5xl w-full bg-white rounded-[3rem] shadow-2xl shadow-indigo-100 overflow-hidden flex flex-col md:flex-row">
        <div class="md:w-1/2 bg-indigo-600 p-12 text-white flex flex-col justify-between">
            <div>
                <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center text-indigo-600 font-black text-2xl mb-6">M</div>
                <h1 class="text-4xl font-black tracking-tighter mb-4">Empower Your Campus.</h1>
                <p class="text-indigo-100 font-medium leading-relaxed">Join thousands of students in making our campus better, safer, and more efficient.</p>
            </div>
            <div class="mt-12">
                <div class="flex -space-x-3 mb-4">
                    <div class="w-10 h-10 rounded-full border-2 border-indigo-600 bg-emerald-400 flex items-center justify-center font-bold text-xs text-white">R</div>
                    <div class="w-10 h-10 rounded-full border-2 border-indigo-600 bg-amber-400 flex items-center justify-center font-bold text-xs text-white">S</div>
                    <div class="w-10 h-10 rounded-full border-2 border-indigo-600 bg-rose-400 flex items-center justify-center font-bold text-xs text-white">P</div>
                </div>
                <p class="text-xs font-bold text-indigo-200 uppercase tracking-widest">+200 students active now</p>
            </div>
        </div>

        <div class="md:w-1/2 p-12 lg:p-20">
            <h2 class="text-3xl font-black text-slate-800 mb-2">Student Login</h2>
            <p class="text-slate-400 text-sm mb-10 font-medium">Welcome back! Use your college credentials.</p>

            <form id="login-form" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Email Address</label>
                    <input type="email" id="email" required class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all font-semibold" placeholder="name@college.edu">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Password</label>
                    <input type="password" id="password" required class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all font-semibold" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-black py-5 rounded-2xl shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition-all active:scale-95">Sign In</button>
            </form>

            <p class="mt-8 text-center text-sm text-slate-400 font-medium">
                New here? <a href="signup.html" class="text-indigo-600 font-black hover:underline">Create Account</a>
            </p>
            
            <div class="mt-10 pt-10 border-t border-slate-50 text-center">
                <a href="admin-login.html" class="text-[10px] font-black text-slate-300 uppercase tracking-widest hover:text-indigo-600 transition-colors">Admin Portal Access</a>
            </div>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
