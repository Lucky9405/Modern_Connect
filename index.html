<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernConnect | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-['Inter'] flex items-center justify-center min-h-screen p-6">
    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl p-10 border border-slate-100">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl font-bold mb-4 shadow-lg shadow-indigo-200">M</div>
            <h1 class="text-2xl font-black text-slate-800 tracking-tight">ModernConnect</h1>
            <p class="text-slate-400 text-sm">Campus Issue Management System</p>
        </div>

        <form id="login-form" class="space-y-4">
            <input type="email" id="email" placeholder="College Email" required class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="password" id="password" placeholder="Password" required class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500">
            
            <div class="text-right pr-2">
                <a href="forgot-password.html" class="text-xs font-bold text-slate-400 hover:text-indigo-600">Forgot Password?</a>
            </div>

            <button type="submit" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-4 rounded-2xl shadow-xl transition-all active:scale-95 mt-4">
                Login
            </button>
        </form>

        <p class="text-center mt-8 text-sm text-slate-500">
            New here? <a href="signup.html" class="text-indigo-600 font-bold hover:underline">Create Student Account</a>
        </p>
    </div>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
