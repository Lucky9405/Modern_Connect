<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | ModernConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-['Inter'] flex items-center justify-center min-h-screen p-6">

    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl p-10 border border-slate-100">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-amber-100 rounded-xl mx-auto flex items-center justify-center text-amber-600 text-xl mb-4">🔑</div>
            <h1 class="text-2xl font-black text-slate-800">Forgot Password?</h1>
            <p class="text-slate-400 text-sm mt-2">Enter your registered college email and we'll send you a recovery link.</p>
        </div>

        <form id="reset-form" class="space-y-4">
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400 uppercase ml-2">College Email</label>
                <input type="email" id="reset-email" placeholder="name@college.edu" required 
                    class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
            </div>
            
            <button type="submit" id="reset-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-xl shadow-indigo-100 transition-all active:scale-95">
                Send Reset Link
            </button>
        </form>

        <div class="text-center mt-8">
            <a href="index.html" class="text-sm text-slate-500 hover:text-indigo-600 font-semibold transition-colors">
                ← Back to Login
            </a>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full text-sm font-bold shadow-2xl opacity-0 transition-all pointer-events-none"></div>

    <script type="module">
        // Import directly from the CDN to ensure it works even if local files fail
        import { auth } from './js/firebase-config.js';
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const resetForm = document.getElementById('reset-form');
        const resetBtn = document.getElementById('reset-btn');
        const toast = document.getElementById('toast');

        function showToast(msg, isError = false) {
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'bg-slate-900', 'bg-red-500');
            toast.classList.add('opacity-100', isError ? 'bg-red-500' : 'bg-slate-900');
            setTimeout(() => toast.classList.replace('opacity-100', 'opacity-0'), 4000);
        }

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            
            // UI Feedback
            resetBtn.disabled = true;
            resetBtn.innerText = "Sending...";

            try {
                await sendPasswordResetEmail(auth, email);
                showToast("✅ Check your email for the reset link!");
                resetForm.reset();
                setTimeout(() => window.location.href = "index.html", 3000);
            } catch (error) {
                console.error(error);
                let message = "An error occurred. Please try again.";
                if (error.code === 'auth/user-not-found') message = "No account found with this email.";
                showToast("❌ " + message, true);
            } finally {
                resetBtn.disabled = false;
                resetBtn.innerText = "Send Reset Link";
            }
        });
    </script>
</body>
</html>
