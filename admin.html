<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernConnect | Admin Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #F8FAFC; }
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-black shadow-lg shadow-indigo-200">A</div>
                <span class="font-black text-slate-800 text-xl tracking-tight">Admin Console</span>
            </div>
            <button id="logout-btn" class="text-slate-400 hover:text-red-600 font-bold text-[10px] uppercase tracking-widest transition-all">Logout</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-10">
            <div class="lg:col-span-1 bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 flex flex-col items-center">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-6">Issue Distribution</h3>
                <div class="w-full h-64 relative">
                    <canvas id="issueChart"></canvas>
                </div>
            </div>

            <div class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-indigo-600 p-8 rounded-[2.5rem] shadow-xl shadow-indigo-200 text-white flex flex-col justify-between transition-transform hover:scale-[1.02]">
                    <p class="font-bold text-indigo-200 uppercase text-[10px] tracking-widest">Community Traction</p>
                    <h2 id="total-upvotes" class="text-6xl font-black mt-2 tracking-tighter">0</h2>
                    <p class="text-indigo-200 text-[10px] font-medium mt-4">Total upvotes received today</p>
                </div>
                <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm flex flex-col justify-between transition-transform hover:scale-[1.02]">
                    <p class="font-bold text-slate-400 uppercase text-[10px] tracking-widest">Campus Efficiency</p>
                    <h2 id="resolution-rate" class="text-6xl font-black text-slate-800 mt-2 tracking-tighter">0%</h2>
                    <p class="text-slate-400 text-[10px] font-medium mt-4">Resolved issues vs Total reports</p>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm overflow-hidden animate-fadeIn">
            <div class="px-8 py-6 border-b border-slate-50 flex justify-between items-center bg-slate-50/30">
                <h3 class="font-black text-slate-800 text-sm uppercase tracking-widest">Moderation Queue</h3>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-3 py-1 bg-white rounded-full border border-slate-100">Live Data</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="text-slate-400 uppercase text-[9px] font-black tracking-widest border-b border-slate-50">
                        <tr>
                            <th class="px-8 py-5">Category & Priority</th>
                            <th class="px-8 py-5">Details</th>
                            <th class="px-8 py-5 text-center">Support</th>
                            <th class="px-8 py-5">Reporter</th>
                            <th class="px-8 py-5 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-issues-list" class="divide-y divide-slate-50">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
