<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | ModernConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 font-['Inter']">
    <nav class="bg-white border-b border-slate-100 px-8 py-4 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-black text-slate-800">Admin Control</h1>
        <button id="logout-btn" class="text-slate-400 hover:text-red-500 font-bold text-sm">Logout</button>
    </nav>

    <main class="max-w-6xl mx-auto p-8">
        <div class="grid grid-cols-3 gap-6 mb-10">
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
                <p class="text-slate-400 text-xs font-bold uppercase">Total</p>
                <h2 id="total-count" class="text-3xl font-black">0</h2>
            </div>
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border-l-4 border-amber-400">
                <p class="text-slate-400 text-xs font-bold uppercase text-amber-500">Pending</p>
                <h2 id="pending-count" class="text-3xl font-black">0</h2>
            </div>
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border-l-4 border-emerald-400">
                <p class="text-slate-400 text-xs font-bold uppercase text-emerald-500">Resolved</p>
                <h2 id="resolved-count" class="text-3xl font-black">0</h2>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-8">
            <div class="col-span-2 bg-white rounded-[2rem] shadow-sm border border-slate-100 p-8">
                <div class="flex justify-between items-center mb-6">
                    <input type="text" id="admin-search" placeholder="Filter issues..." class="bg-slate-50 border border-slate-100 px-4 py-2 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 w-64">
                    <button id="export-csv" class="text-indigo-600 font-bold text-sm">Export CSV</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-slate-400 text-[10px] uppercase font-bold tracking-widest">
                            <tr>
                                <th class="px-6 py-4">Category</th>
                                <th class="px-6 py-4">Detail & Description</th>
                                <th class="px-6 py-4">Status</th>
                                <th class="px-6 py-4 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="admin-issues-list" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>

            <div class="bg-white rounded-[2rem] shadow-sm border border-slate-100 p-8 h-fit">
                <h3 class="text-sm font-black text-slate-800 mb-6 uppercase tracking-wider">Issue Distribution</h3>
                <div class="h-64"><canvas id="issueChart"></canvas></div>
            </div>
        </div>
    </main>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
