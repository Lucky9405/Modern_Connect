<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernConnect | Admin Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="bg-white border-b px-8 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-3">
            <span class="bg-indigo-600 text-white px-2 py-1 rounded text-[10px] font-black uppercase tracking-widest">Admin</span>
            <h1 class="text-xl font-bold text-slate-800 tracking-tight">ModernConnect</h1>
        </div>
        <div class="flex items-center gap-6">
            <button id="export-csv" class="hidden md:block bg-emerald-50 text-emerald-700 border border-emerald-200 px-4 py-2 rounded-xl text-xs font-bold hover:bg-emerald-100 transition">📊 Export CSV</button>
            <a href="profile.html" class="w-10 h-10 bg-slate-900 text-white rounded-full flex items-center justify-center font-bold shadow-lg">A</a>
            <button id="logout-btn" class="text-red-500 font-bold text-sm hover:underline">Logout</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 md:p-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <div class="lg:col-span-1 grid grid-cols-1 gap-4">
                <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Total Reports</p>
                    <h3 id="total-count" class="text-4xl font-black text-slate-800 mt-1">0</h3>
                </div>
                <div class="bg-amber-50 p-6 rounded-[2rem] border border-amber-100 shadow-sm">
                    <p class="text-[10px] font-black text-amber-600 uppercase tracking-widest">Pending Action</p>
                    <h3 id="pending-count" class="text-4xl font-black text-amber-800 mt-1">0</h3>
                </div>
            </div>
            <div class="lg:col-span-2 bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm flex flex-col items-center justify-center h-64">
                <canvas id="issueChart"></canvas>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <div class="flex-1 relative">
                <input type="text" id="admin-search" placeholder="Search location or issue..." class="w-full p-4 pl-12 bg-white border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
                <span class="absolute left-4 top-4 opacity-30">🔍</span>
            </div>
            <select id="filter-category" class="p-4 bg-white border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm font-semibold text-slate-600">
                <option value="All">All Categories</option>
                <option value="Electrical">Electrical</option>
                <option value="IT/Network">IT/Network</option>
                <option value="Plumbing">Plumbing</option>
                <option value="Safety">Safety</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="bg-white rounded-[2rem] shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-50/50 text-slate-400 text-[10px] font-black uppercase tracking-widest">
                        <tr>
                            <th class="px-8 py-5">Issue Type</th>
                            <th class="px-8 py-5">Location</th>
                            <th class="px-8 py-5">Status</th>
                            <th class="px-8 py-5 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-issues-list" class="divide-y divide-slate-50">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
