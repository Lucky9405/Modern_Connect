<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernConnect | Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-purple-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-8 border border-gray-100">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-purple-600">Join ModernConnect</h2>
            <p class="text-gray-500 mt-2">Create your campus reporter profile</p>
        </div>

        <form id="signup-form" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700">Full Name</label>
                <input type="text" id="fullName" required class="w-full mt-1 p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none" placeholder="Enter your name">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">College Email</label>
                <input type="email" id="email" required class="w-full mt-1 p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none" placeholder="name@moderncoe.edu.in">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">Password</label>
                <input type="password" id="password" required class="w-full mt-1 p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none" placeholder="Min. 6 characters">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">Role</label>
                <select id="role" class="w-full mt-1 p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-purple-500">
                    <option value="student">Student</option>
                    <option value="admin">Admin (Staff)</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg mt-4">
                Register
            </button>
        </form>

        <div class="mt-6 text-center border-t pt-4">
            <p class="text-sm text-gray-600">Already a member? <a href="index.html" class="text-purple-600 font-bold hover:underline">Log In</a></p>
        </div>
    </div>

    <script type="module" src="js/signup.js"></script>
</body>
</html>
