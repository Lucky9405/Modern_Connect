<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join ModernConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-['Inter'] flex items-center justify-center min-h-screen p-6">

    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl shadow-slate-200 p-10 border border-slate-100">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl font-bold mb-4 shadow-lg shadow-indigo-200">M</div>
            <h1 class="text-2xl font-black text-slate-800 tracking-tight">Create Account</h1>
            <p class="text-slate-400 text-sm mt-1">Join the ModernConnect student community</p>
        </div>

        <form id="signup-form" class="space-y-4">
            <input type="text" id="name" placeholder="Full Name" required class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
            <input type="email" id="email" placeholder="College Email" required class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
            <input type="password" id="password" placeholder="Create Password" required class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
            
            <input type="hidden" id="role" value="student">

            <button type="submit" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-4 rounded-2xl shadow-xl transition-all active:scale-95 mt-4">
                Sign Up
            </button>
        </form>

        <p class="text-center mt-8 text-sm text-slate-500">
            Already have an account? <a href="index.html" class="text-indigo-600 font-bold hover:underline">Login</a>
        </p>
    </div>

    <script type="module" src="js/signup.js"></script>
</body>
</html>
