<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join ModernConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">
    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl p-10">
        <h1 class="text-2xl font-black text-slate-800 text-center mb-6">Create Account</h1>
        <form id="signup-form" class="space-y-4">
            <input type="text" id="name" placeholder="Full Name" required class="w-full p-4 bg-slate-50 border rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="email" id="email" placeholder="College Email" required class="w-full p-4 bg-slate-50 border rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="password" id="password" placeholder="Password" required class="w-full p-4 bg-slate-50 border rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="hidden" id="role" value="student">
            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-xl hover:bg-indigo-700">Sign Up</button>
        </form>
        <p class="text-center mt-6 text-sm text-slate-500">Already have an account? <a href="index.html" class="text-indigo-600 font-bold">Login</a></p>
    </div>
    <script type="module" src="js/signup.js"></script>
</body>
</html>
