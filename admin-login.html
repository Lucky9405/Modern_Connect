<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernConnect | Admin Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-slate-800 rounded-[2.5rem] p-10 border border-slate-700 shadow-2xl relative overflow-hidden">
        <div class="absolute -top-20 -right-20 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl"></div>
        
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-black text-2xl mx-auto mb-6 shadow-xl shadow-indigo-500/20">A</div>
            <h1 class="text-2xl font-black text-white tracking-tight">Admin Gate</h1>
            <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-2">Restricted Access Only</p>
        </div>

        <form id="admin-login-form" class="space-y-6 relative z-10">
            <div class="space-y-2">
                <input type="email" id="admin-email" required class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl outline-none focus:border-indigo-500 text-white font-medium transition-all" placeholder="Admin ID">
            </div>
            <div class="space-y-2">
                <input type="password" id="admin-password" required class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl outline-none focus:border-indigo-500 text-white font-medium transition-all" placeholder="Security Token">
            </div>
            <button type="submit" class="w-full bg-white text-slate-900 font-black py-4 rounded-2xl hover:bg-indigo-50 transition-all active:scale-95 shadow-lg">Authenticate</button>
        </form>

        <div class="mt-8 text-center">
            <a href="index.html" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest hover:text-white transition-colors">Return to Student Portal</a>
        </div>
    </div>

    <script type="module" src="js/admin-login.js"></script>
</body>
</html>
