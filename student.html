<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ModernConnect | Campus Pulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
        .trending-card { border: 2px solid #6366f1 !important; box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.15); }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-[#F8FAFC]">

    <nav class="glass-nav border-b border-slate-200 sticky top-0 z-[100] w-full">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black text-xl shadow-lg">M</div>
                <span class="font-black text-slate-800 text-xl tracking-tight hidden sm:block">ModernConnect</span>
            </div>
            <div class="flex items-center gap-4">
                <div onclick="toggleModal('profile-modal', true)" class="flex items-center gap-3 px-3 py-1.5 bg-slate-50 rounded-2xl border border-slate-100 cursor-pointer hover:bg-slate-100 transition-all">
                    <div id="nav-user-initial" class="w-8 h-8 bg-indigo-600 text-white rounded-full flex items-center justify-center text-xs font-black shadow-sm">?</div>
                    <span id="nav-user-name" class="text-xs font-bold text-slate-700 hidden md:block">Loading...</span>
                </div>
                <button id="logout-btn" class="bg-slate-100 hover:bg-red-50 hover:text-red-600 text-slate-500 px-4 py-2.5 rounded-xl text-xs font-bold transition-all">Logout</button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-10">
        <div id="admin-announcement" class="hidden mb-8 animate-fadeIn">
            <div class="bg-indigo-600 rounded-[2rem] p-6 text-white flex items-center gap-4 shadow-xl shadow-indigo-100">
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center text-xl">📢</div>
                <div class="flex-1">
                    <p class="text-[10px] font-black uppercase tracking-widest text-indigo-200">Official Announcement</p>
                    <p id="announcement-text" class="text-sm font-bold leading-tight">Latest update...</p>
                </div>
                <button onclick="this.parentElement.parentElement.classList.add('hidden')" class="text-white/50 hover:text-white font-bold text-xs">✕</button>
            </div>
        </div>

        <div class="flex flex-col md:flex-row md:items-end justify-between gap-8 mb-10">
            <div class="space-y-4">
                <h1 class="text-4xl font-black text-slate-900 tracking-tighter leading-none">Campus Pulse</h1>
                <div class="flex bg-slate-200/60 p-1 rounded-2xl w-fit border border-slate-200/50">
                    <button id="tab-feed" class="px-5 py-2 rounded-xl font-bold text-xs bg-white shadow-sm text-indigo-600">Explore</button>
                    <button id="tab-my-activity" class="px-5 py-2 rounded-xl font-bold text-xs text-slate-500">My Activity</button>
                    <button id="tab-report" class="px-5 py-2 rounded-xl font-bold text-xs text-slate-500">Report</button>
                </div>
            </div>
            <div class="relative w-full md:w-80">
                <input type="text" id="search-feed" placeholder="Search locations..." class="w-full bg-white border border-slate-200 p-4 pl-12 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium">
                <span class="absolute left-4 top-4 text-slate-400">🔍</span>
            </div>
        </div>

        <div id="stats-bar" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12">
            <div class="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm text-center">
                <p id="stat-label-upvotes" class="text-[10px] font-black text-indigo-500 uppercase tracking-widest">Global Support</p>
                <h2 id="total-upvotes-stats" class="text-2xl font-black text-slate-800">0</h2>
            </div>
            <div class="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm text-center">
                <p class="text-[10px] font-black text-emerald-500 uppercase tracking-widest">Fixed</p>
                <h2 id="total-resolved-stats" class="text-2xl font-black text-slate-800">0</h2>
            </div>
            <div class="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm text-center">
                <p class="text-[10px] font-black text-amber-500 uppercase tracking-widest">Pending</p>
                <h2 id="total-pending-stats" class="text-2xl font-black text-slate-800">0</h2>
            </div>
            <div class="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm text-center">
                <p class="text-[10px] font-black text-rose-500 uppercase tracking-widest">Strength</p>
                <h2 id="community-power" class="text-2xl font-black text-slate-800">0%</h2>
            </div>
        </div>

        <div id="feed-section">
            <div id="community-feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>

        <div id="report-section" class="hidden max-w-xl mx-auto animate-fadeIn">
            <div class="bg-white p-10 rounded-[3.5rem] shadow-xl border border-slate-100">
                <h2 class="text-2xl font-black text-slate-800 mb-8 tracking-tighter">Broadcast an Issue</h2>
                <form id="issue-form" class="space-y-6">
                    <select id="category" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold">
                        <option value="Electrical">Electrical</option>
                        <option value="IT Support">IT Support</option>
                        <option value="Hygiene">Hygiene</option>
                        <option value="Infrastructure">Infrastructure</option>
                        <option value="Parking">Campus Parking</option>
                        <option value="Cafeteria">Cafeteria</option>
                        <option value="Other">Other</option>
                    </select>
                    <div id="other-category-container" class="hidden animate-fadeIn">
                        <input type="text" id="other-category-input" placeholder="Custom Category" class="w-full p-4 bg-indigo-50 rounded-2xl outline-none font-bold border border-indigo-100">
                    </div>
                    <input type="text" id="location" placeholder="Exact Location" required class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold">
                    <textarea id="description" placeholder="Description..." required class="w-full p-4 bg-slate-50 rounded-2xl outline-none h-32 font-bold"></textarea>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-black py-5 rounded-2xl hover:bg-indigo-700 active:scale-95 transition-all">Broadcast Issue</button>
                </form>
            </div>
        </div>
    </main>

    <div class="fixed bottom-8 right-8 z-[100]">
        <button id="sos-btn" class="w-16 h-16 bg-rose-600 text-white rounded-full shadow-2xl flex items-center justify-center hover:bg-rose-700 active:scale-90 transition-all group">
            <span class="font-black text-xs">SOS</span>
        </button>
    </div>

    <div id="profile-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[200] hidden flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-10 text-center animate-fadeIn relative">
            <button onclick="toggleModal('profile-modal', false)" class="absolute top-8 right-8 text-slate-400 font-bold">✕</button>
            <div id="modal-user-initial" class="w-20 h-20 bg-indigo-600 text-white rounded-full flex items-center justify-center text-3xl font-black mx-auto mb-4">?</div>
            <h2 id="modal-user-name" class="text-2xl font-black text-slate-800 tracking-tight">Student Name</h2>
            <p id="modal-user-email" class="text-slate-400 text-xs font-medium mb-8">email@college.edu</p>
            <form id="profile-edit-form" class="space-y-3 text-left">
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1"><label class="text-[9px] font-black text-slate-400 uppercase ml-2">Course</label><input type="text" id="edit-course" class="w-full p-3 bg-slate-50 rounded-xl outline-none text-xs font-bold"></div>
                    <div class="space-y-1"><label class="text-[9px] font-black text-slate-400 uppercase ml-2">Year</label><input type="text" id="edit-year" class="w-full p-3 bg-slate-50 rounded-xl outline-none text-xs font-bold"></div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1"><label class="text-[9px] font-black text-slate-400 uppercase ml-2">Div</label><input type="text" id="edit-div" class="w-full p-3 bg-slate-50 rounded-xl outline-none text-xs font-bold"></div>
                    <div class="space-y-1"><label class="text-[9px] font-black text-slate-400 uppercase ml-2">Roll No</label><input type="text" id="edit-roll" class="w-full p-3 bg-slate-50 rounded-xl outline-none text-xs font-bold"></div>
                </div>
                <button type="submit" id="save-profile-btn" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl mt-4">Update Profile</button>
            </form>
            <button onclick="toggleModal('feedback-modal', true)" class="mt-6 text-[10px] font-black text-indigo-500 uppercase tracking-widest hover:underline">Submit Feedback</button>
        </div>
    </div>

    <div id="feedback-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[250] hidden flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-10 text-center animate-fadeIn shadow-2xl">
            <h2 class="text-2xl font-black text-slate-800 mb-2">Feedback</h2>
            <p class="text-slate-400 text-xs font-medium mb-6">Suggest improvements</p>
            <textarea id="feedback-text" placeholder="Your suggestion..." class="w-full p-4 bg-slate-50 rounded-2xl outline-none h-32 font-bold text-sm border"></textarea>
            <div class="flex gap-3 mt-4">
                <button onclick="toggleModal('feedback-modal', false)" class="flex-1 bg-slate-100 text-slate-500 font-black py-4 rounded-2xl text-[10px]">CANCEL</button>
                <button onclick="submitFeedback()" class="flex-1 bg-indigo-600 text-white font-black py-4 rounded-2xl text-[10px] shadow-lg">SUBMIT</button>
            </div>
        </div>
    </div>

    <div id="sos-modal" class="fixed inset-0 bg-rose-950/90 backdrop-blur-md z-[300] hidden flex items-center justify-center p-6 text-center">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-10 animate-fadeIn">
            <h2 class="text-2xl font-black text-slate-800 mb-2">Emergency?</h2>
            <button id="confirm-sos" class="w-full bg-rose-600 text-white font-black py-4 rounded-2xl shadow-xl shadow-rose-200 mb-4">SEND SOS</button>
            <button onclick="toggleModal('sos-modal', false)" class="text-slate-400 font-bold text-xs uppercase">Cancel</button>
        </div>
    </div>

    <div id="success-toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[300] hidden animate-fadeIn">
        <div class="bg-slate-900 text-white px-8 py-4 rounded-2xl shadow-2xl flex items-center gap-4">
            <div class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center text-white font-bold">✓</div>
            <p class="text-xs font-black uppercase">Broadcasted!</p>
        </div>
    </div>

    <script type="module" src="js/community-student.js"></script>
</body>
</html>
