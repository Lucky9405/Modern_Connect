<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernConnect | Student Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-['Inter'] pb-20">

    <nav class="bg-white border-b px-6 py-3 flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl">M</div>
            <h1 class="text-xl font-bold text-slate-800">ModernConnect</h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="profile.html" class="flex items-center gap-2 p-1 hover:bg-slate-50 rounded-full transition">
                <div class="w-10 h-10 bg-slate-200 rounded-full flex items-center justify-center text-xl shadow-inner">👤</div>
            </a>
            <button id="logout-btn" class="text-red-500 font-bold text-sm">Logout</button>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto p-6">
        <header class="mb-10">
            <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Hello, <span id="nav-user-name" class="text-indigo-600">Student</span></h2>
            <p class="text-slate-500">How can we help you today?</p>
        </header>

        <div class="bg-white rounded-[2rem] shadow-xl p-8 border border-slate-100 mb-12">
            <form id="issue-form" class="space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Category</label>
                        <select id="category" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="Electrical">⚡ Electrical</option>
                            <option value="Plumbing">🚰 Plumbing</option>
                            <option value="IT/Network">🌐 IT & Wi-Fi</option>
                            <option value="Cleanliness">🧹 Cleanliness</option>
                            <option value="Other">❓ Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Location</label>
                        <input type="text" id="location" required placeholder="e.g. Library Desk 12" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div id="other-category-div" class="hidden">
                    <input type="text" id="other-category-input" placeholder="What is the issue type?" class="w-full p-4 bg-indigo-50 border border-indigo-200 rounded-2xl outline-none">
                </div>
                <textarea id="description" rows="3" required placeholder="Describe the problem..." class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none"></textarea>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg transition-transform hover:-translate-y-1">Submit Issue</button>
            </form>
        </div>

        <h3 class="text-xl font-bold text-slate-800 mb-8 flex items-center gap-3">
            <span class="p-2 bg-white rounded-lg shadow-sm">🕒</span> My Activity Timeline
        </h3>
        <div id="student-timeline" class="space-y-6">
            </div>
    </main>

    <div id="toast" class="fixed bottom-10 right-10 transform translate-y-20 opacity-0 transition-all duration-500 z-[100]">
        <div class="bg-slate-900 text-white px-6 py-4 rounded-2xl flex items-center gap-4 shadow-2xl">
            <div id="toast-icon" class="w-6 h-6 rounded-full bg-green-500 flex items-center justify-center text-xs">✓</div>
            <p id="toast-msg" class="text-sm font-bold"></p>
        </div>
    </div>

    <script type="module" src="js/student.js"></script>
</body>
</html>
