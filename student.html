<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernConnect | Campus Community</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
        #comments-list::-webkit-scrollbar { width: 4px; }
        #comments-list::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 10px; }
        .trending-card { border: 2px solid #6366f1 !important; box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.15); }
    </style>
</head>
<body class="bg-[#F8FAFC]">

    <nav class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-[100] w-full">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2 flex-shrink-0">
                <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black text-xl shadow-lg shadow-indigo-200">M</div>
                <span class="font-black text-slate-800 text-xl tracking-tight">ModernConnect</span>
            </div>
            <button id="logout-btn" class="bg-slate-100 hover:bg-red-50 hover:text-red-600 text-slate-500 px-5 py-2.5 rounded-xl text-xs font-bold transition-all ml-auto">Logout</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-10">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-8 mb-10">
            <div class="space-y-4">
                <h1 class="text-4xl font-black text-slate-900 tracking-tighter leading-none">Campus Pulse</h1>
                <div class="flex bg-slate-200/60 p-1 rounded-2xl w-fit border border-slate-200/50 shadow-inner">
                    <button id="tab-feed" class="px-5 py-2 rounded-xl font-bold text-xs bg-white shadow-sm text-indigo-600 transition-all">Explore</button>
                    <button id="tab-my-activity" class="px-5 py-2 rounded-xl font-bold text-xs text-slate-500 hover:text-indigo-600 transition-all">My Activity</button>
                    <button id="tab-report" class="px-5 py-2 rounded-xl font-bold text-xs text-slate-500 hover:text-indigo-600 transition-all">Report</button>
                </div>
            </div>
            <div class="relative w-full md:w-80">
                <input type="text" id="search-feed" placeholder="Search locations..." class="w-full bg-white border border-slate-200 p-4 pl-12 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium shadow-sm">
                <span class="absolute left-4 top-4 text-slate-400">🔍</span>
            </div>
        </div>

        <div id="stats-bar" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12 animate-fadeIn">
            <div class="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm text-center">
                <p id="stat-label-upvotes" class="text-[10px] font-black text-indigo-500 uppercase mb-1 tracking-widest">Total Support</p>
                <h2 id="total-upvotes-stats" class="text-2xl font-black text-slate-800">0</h2>
            </div>
            <div class="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm text-center">
                <p class="text-[10px] font-black text-emerald-500 uppercase mb-1 tracking-widest">Issues Fixed</p>
                <h2 id="total-resolved-stats" class="text-2xl font-black text-slate-800">0</h2>
            </div>
            <div class="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm text-center">
                <p class="text-[10px] font-black text-amber-500 uppercase mb-1 tracking-widest">Pending</p>
                <h2 id="total-pending-stats" class="text-2xl font-black text-slate-800">0</h2>
            </div>
            <div class="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm text-center">
                <p class="text-[10px] font-black text-rose-500 uppercase mb-1 tracking-widest">Strength</p>
                <h2 id="community-power" class="text-2xl font-black text-slate-800">0%</h2>
            </div>
        </div>

        <div id="feed-section">
            <div id="community-feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>

        <div id="report-section" class="hidden max-w-xl mx-auto animate-fadeIn">
            <div class="bg-white p-10 rounded-[3.5rem] shadow-xl border border-slate-100">
                <h2 class="text-2xl font-black text-slate-800 mb-8">Broadcast an Issue</h2>
                <form id="issue-form" class="space-y-6">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Category</label>
                        <select id="category" class="w-full mt-1 p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-slate-700">
                            <option value="Electrical">Electrical</option>
                            <option value="IT Support">IT Support</option>
                            <option value="Hygiene">Hygiene</option>
                            <option value="Infrastructure">Infrastructure</option>
                            <option value="Parking">Campus Parking</option>
                            <option value="Cafeteria">Cafeteria / Canteen</option>
                            <option value="Security">Campus Security</option>
                            <option value="Library">Library Services</option>
                            <option value="Other">Other (Specify below)</option>
                        </select>
                    </div>
                    <div id="other-category-container" class="hidden animate-fadeIn">
                        <label class="text-[10px] font-bold text-indigo-500 uppercase tracking-widest ml-2">Specify Category</label>
                        <input type="text" id="other-category-input" placeholder="Enter custom category name" class="w-full mt-1 p-4 bg-indigo-50/50 border border-indigo-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 font-bold">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Location</label>
                        <input type="text" id="location" placeholder="Where is it?" required class="w-full mt-1 p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 font-bold">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Description</label>
                        <textarea id="description" placeholder="Describe the problem..." required class="w-full mt-1 p-4 bg-slate-50 rounded-2xl outline-none h-32 focus:ring-2 focus:ring-indigo-500 font-bold"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-black py-5 rounded-2xl shadow-xl hover:bg-indigo-700 transition-all">Broadcast to Community</button>
                </form>
            </div>
        </div>
    </main>

    <div id="comment-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[150] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-[2.5rem] p-8 flex flex-col h-[75vh] shadow-2xl relative">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-black text-xl text-slate-800">Discussion</h3>
                <button onclick="document.getElementById('comment-modal').classList.add('hidden')" class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center font-bold">✕</button>
            </div>
            <div id="comments-list" class="flex-1 overflow-y-auto space-y-5 mb-6 pr-2"></div>
            <div class="flex gap-2 bg-slate-50 p-2 rounded-2xl border">
                <input type="text" id="new-comment" placeholder="Add a comment..." class="flex-1 bg-transparent p-3 outline-none text-sm font-semibold">
                <button id="send-comment" class="bg-indigo-600 text-white px-6 rounded-xl font-black text-xs uppercase tracking-widest">Post</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/community-student.js"></script>
</body>
</html>
